services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dealflow}
      POSTGRES_USER: ${DB_USERNAME:-dealflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    image: dealflow-api
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    volumes: ["./apps/api:/app"]
    environment: &api-env
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: ${DB_DATABASE:-dealflow}
      DB_USERNAME: ${DB_USERNAME:-dealflow}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_CLIENT: predis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD}
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    image: dealflow-api
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    volumes: ["./apps/api:/app"]
    environment: *api-env
    command: php artisan queue:work --tries=3 --timeout=60
    depends_on: [api]
  web:
    image: node:24-bookworm-slim
    working_dir: /app
    volumes: ["./apps/web:/app"]
    environment:
      API_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    command: npm run dev -- --hostname 0.0.0.0
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
